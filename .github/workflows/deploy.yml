# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
  # Allow manual redeploys (e.g. to retry a transient GitHub Pages backend failure)
  # without pushing an empty commit.
  workflow_dispatch:
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 18.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build MyST HTML (paper, lands at site root)
        run: myst build --html

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto slides
        run: quarto render slides/index.qmd

      - name: Merge slide output under /slides without overwriting MyST tree
        run: |
          mkdir -p _build/html/slides
          cp slides/index.html _build/html/slides/index.html
          cp -r slides/index_files _build/html/slides/index_files
          # Dereference the symlink so the bundle is self-contained
          cp -rL slides/images _build/html/slides/images
          echo "--- _build/html top-level ---"
          ls -la _build/html
          echo "--- _build/html/slides ---"
          ls -la _build/html/slides

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./_build/html"
          # Attempt-scoped name so a re-run of a failed deploy does not collide with
          # the previous attempt's artifact (deploy-pages counts artifacts per run,
          # not per attempt, and aborts if it finds two named "github-pages").
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
